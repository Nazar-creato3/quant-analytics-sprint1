<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Login preview — Quant Analytics</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    body { margin: 0; min-height: 100vh; background: #0B0B0B; color: #e5e7eb; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
    .wrap { text-align: center; max-width: 360px; }
    .logo-box { width: 64px; height: 64px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
    .logo-box img { width: 56px; height: 56px; object-fit: contain; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #9ca3af; font-size: 14px; }
    nav { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; padding: 0 16px; background: rgba(17,17,17,0.95); border-bottom: 1px solid rgba(255,255,255,0.08); }
    nav img { width: 24px; height: 24px; margin-right: 8px; }
  </style>
</head>
<body>
  <nav><img src="/logo.png" alt="Quant Analytics" /><strong>QUANT ANALYTICS</strong></nav>
  <div class="wrap">
    <div class="logo-box"><img src="/logo.png" alt="Quant Analytics" /></div>
    <h1>Quant Analytics</h1>
    <p>Dark UI — transparent logo variant</p>
  </div>
</body>
</html>
