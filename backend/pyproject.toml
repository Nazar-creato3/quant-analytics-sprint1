[project]
name = "apex-intel-backend"
version = "0.1.0"
# Product image and CI are CPython 3.13 (docs/architecture/tech-stack.md).
# numpy==2.2.6; torch>=2.13,<3 clears D-01-2 advisories on CPython 3.13.
requires-python = ">=3.13,<3.14"
description = "Quant Analytics backend. Direct pins are requirements.txt; transitive lock is uv.lock."
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.31",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.2.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "alembic==1.20.1",
    "psycopg2-binary==2.9.10",
    "redis[asyncio]==5.1.1",
    "celery[redis]==5.6.3",
    "flower==2.0.1",
    "httpx==0.27.2",
    "websockets==13.1",
    "PyJWT==2.15.1",
    "cryptography>=42.0.0",
    "passlib[bcrypt,argon2]==1.7.4",
    "argon2-cffi>=23.1.0",
    "qrcode[pil]==8.0",
    "numpy==2.2.6",
    "pandas==3.0.6",
    "scikit-learn==1.5.2",
    "lightgbm==4.6.0",
    "shap>=0.47.0,<0.52",
    "torch>=2.13.0,<3.0.0",
    "safetensors>=0.4.5",
    "joblib==1.4.2",
    "statsmodels==0.14.4",
    "mapie==0.9.0",
    # darts==0.30.0 is in requirements.txt and is not in this lock.
    # uv lock 2026-10-06: darts==0.30.0 depends on numpy>=1.19.0,<2.0.0,
    # which contradicts numpy==2.2.6. No version was substituted.
    "hmmlearn==0.3.3",
    # EXCLUDED from lock mlflow==2.16.2: PyPI requires_dist pandas<3,
    # which contradicts pandas==3.0.6. No version was substituted.
    # uv lock: "Because mlflow==2.16.2 depends on pandas<3".
    # "mlflow==2.16.2",
    "transformers>=5.10.0,<6.0.0",
    "chronos-forecasting>=2.3.0,<3.0.0",
    "yfinance==1.5.1",
    "curl_cffi>=0.15.0",
    "pandas-datareader>=0.10.0",
    "alpaca-py==0.30.1",
    "apimoex>=1.4.0",
    "aiomoex>=2.0.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    # Cap below 4.5.65: those releases pin multidict==6.7.1 (CVE-2026-104874).
    "ccxt>=4.4.0,<4.5.65",
    "multidict>=6.9.1",
    "feedparser==6.0.11",
    "vaderSentiment==3.3.2",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "sentry-sdk[fastapi]==2.14.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "reportlab==4.2.5",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==5.0.0",
    "anyio[trio]==4.14.2",
    "hypothesis==6.112.1",
    "quantstats==0.0.62",
    "ipython>=8.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "FundamentalAnalysis>=0.3.0; python_version < \"3.13\"",
    # EXCLUDED from lock financetoolkit>=1.9.0: every release on PyPI
    # either requires pandas<3 (through 2.0.1) or scikit-learn>=1.6
    # (from 2.0.2). requirements.txt pins pandas==3.0.6 and
    # scikit-learn==1.5.2. No version was substituted.
    # "financetoolkit>=1.9.0",
    "python-dotenv==1.2.2",
    "skfolio==0.6.0",
]

# Packages that are in requirements-ci.txt and not in requirements.txt.
# The GitHub runner still installs requirements-ci.lock, not this project.
[dependency-groups]
ci = [
    "greenlet>=3.0.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "pip-audit>=2.7.0",
]

[tool.uv]
package = false
