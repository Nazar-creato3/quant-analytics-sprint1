[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = app/tests grid_bot/tests grid_bot/connectivity/tests grid_bot/topology/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    --no-cov
    --import-mode=importlib

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may need DB/Redis)
    slow: Tests that take > 5 seconds
    staging_drill: Staging drill integration (optional CI label)